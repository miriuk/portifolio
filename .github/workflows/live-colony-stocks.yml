# The stocks floor: the same survival colony on daily US stock bars.
#
# Every weekday night (a few hours after the NYSE close) the job restores the
# colony's journal from the `colony-live-stocks` branch, feeds it the
# trading day that just closed (paper trading on Nasdaq's public daily
# bars: SPY, QQQ, AAPL, MSFT, NVDA, AMZN — no account, no keys, no real
# money), runs the day's rituals and publishes the journal back. One bar
# is one colony day; a colony week is five trading days.
#
# "Run workflow" (with reset) founds a fresh colony.
#
# After each tick the colony's holdings are mirrored onto Trading 212's
# PRACTICE account (virtual money; broker/mirror.py), when the repository
# has the secrets T212_API_KEY and T212_API_SECRET of a practice-account
# API key. The variable T212_PAUSE=true stops the mirror.
name: Live colony (stocks)

on:
  # Nasdaq publishes the day's row a few hours after the close: not yet at
  # 23:50 UTC, there by 01:30 UTC. Tue-Sat 01:30 UTC picks up Mon-Fri, and
  # the 05:30 retry is a no-op when nothing new closed.
  schedule:
    - cron: "30 1 * * 2-6"
    - cron: "30 5 * * 2-6"
  workflow_dispatch:
    inputs:
      reset:
        description: "Start a fresh colony (discard the saved state)"
        type: boolean
        default: false
      deposit_gbp:
        description: "Pounds to found a fresh colony with, split across the founders; ignored without reset"
        type: string
        default: "1000"

permissions:
  contents: write

concurrency:
  group: live-colony-stocks
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COLONY_BRANCH: colony-live-stocks
      COLONY_DB: live/stocks.db
      PYTHONUNBUFFERED: "1"
      CRYPTOARENA_DAILY_SOURCE: nasdaq    # the one public source that answers GitHub runners
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[live]"

      - name: Restore the colony
        if: ${{ !inputs.reset }}
        run: |
          mkdir -p live
          if git fetch --depth 1 origin "$COLONY_BRANCH" 2>/dev/null; then
            git show "origin/$COLONY_BRANCH:colony.db" > "$COLONY_DB"
            echo "restored $(stat -c %s "$COLONY_DB") bytes"
          else
            echo "no saved colony — founding a new one"
          fi

      - name: Tick
        # the deposit only matters at the founding: a resumed colony keeps its budget
        run: cryptoarena live --floor stocks --once --db "$COLONY_DB" --deposit-gbp "${{ inputs.deposit_gbp || '1000' }}"

      - name: Status
        run: cryptoarena live --status --db "$COLONY_DB" | tee live/status.json

      - name: Publish the colony
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          pub=$(mktemp -d)
          cp "$COLONY_DB" "$pub/colony.db"
          cp live/status.json "$pub/status.json"
          {
            echo "# Live colony"
            echo
            echo "Updated $(date -u +'%Y-%m-%d %H:%M UTC') by the nightly job."
            echo "Paper trading on Nasdaq's daily bars, mirrored to a Trading 212 practice account."
            echo "Read \`colony.db\` with the dashboard:"
            echo
            echo '```'
            echo "CRYPTOARENA_DB_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${COLONY_BRANCH}/colony.db"
            echo '```'
            echo
            echo '```json'
            cat live/status.json
            echo '```'
          } > "$pub/README.md"
          cd "$pub"
          git init -q -b "$COLONY_BRANCH"
          git config user.name "live-colony-stocks[bot]"
          git config user.email "live-colony@users.noreply.github.com"
          git add -A
          git commit -q -m "colony tick $(date -u +'%Y-%m-%dT%H:%MZ')"
          # one commit, replaced every hour: the history lives inside the journal
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$COLONY_BRANCH"

      - name: Mirror to the Trading 212 practice account
        continue-on-error: true           # the colony is already saved; the mirror catches up next run
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
          T212_PAUSE: ${{ vars.T212_PAUSE }}
        run: |
          if [ -z "$T212_API_KEY" ] || [ -z "$T212_API_SECRET" ]; then
            echo "No practice-account key (secrets T212_API_KEY / T212_API_SECRET): the colony stays on paper only."
            exit 0
          fi
          cryptoarena t212 mirror --floor stocks --db "$COLONY_DB" --execute
